[project]
name = "gaya-pipeline"
version = "0.1.0"
description = "Gaya Bench のシナリオ検証・音声生成パイプライン"
readme = "README.md"
authors = [
    { name = "Hitsuki-Ban", email = "houtei.ban@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.57",
    "jsonschema>=4.26.0",
    "pyopenjtalk-plus[onnxruntime]==0.4.1.post8",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
gpt-sovits = [
    "cn2an==0.5.24",
    "fast-langdetect==1.0.1",
    "ffmpeg-python==0.2.0",
    "jieba==0.42.1",
    "jieba-fast==0.53",
    "librosa==0.10.2",
    "matplotlib==3.10.3",
    "numpy==1.26.4",
    "peft==0.17.1",
    "pypinyin==0.55.0",
    "pytorch-lightning==2.6.5",
    "split-lang==2.1.1",
    "torch==2.7.0",
    "torchaudio==2.7.0",
    "torchmetrics==1.5.2",
    "transformers==4.50.3",
    "x-transformers==2.24.0",
]
irodori = [
    "irodori-tts==0.1.0",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchcodec==0.10.0",
]
qwen = [
    "qwen-tts==0.1.1",
    "torch==2.11.0",
    "torchaudio==2.11.0",
]
voxcpm2 = [
    "funasr==1.3.1",
    "huggingface-hub==1.7.1",
    "modelscope==1.35.0",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchcodec==0.10.0",
    "transformers==5.3.0",
    "voxcpm",
    "wetext==0.1.2",
]

[project.scripts]
gaya = "gaya_pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
conflicts = [
    [
        { extra = "gpt-sovits" },
        { extra = "irodori" },
    ],
    [
        { extra = "gpt-sovits" },
        { extra = "qwen" },
    ],
    [
        { extra = "irodori" },
        { extra = "qwen" },
    ],
    [
        { extra = "gpt-sovits" },
        { extra = "voxcpm2" },
    ],
    [
        { extra = "irodori" },
        { extra = "voxcpm2" },
    ],
    [
        { extra = "qwen" },
        { extra = "voxcpm2" },
    ],
]
extra-build-variables = { sentencepiece = { CMAKE_POLICY_VERSION_MINIMUM = "3.5" } }

[tool.uv.sources]
irodori-tts = { git = "https://github.com/Aratako/Irodori-TTS.git", rev = "eaf74d6a19138f743acb5b71a445fd25a57db987" }
dacvae = { git = "https://github.com/facebookresearch/dacvae", rev = "414c20785fc3a28373073ea8ef7a1316eeeaca6e" }
voxcpm = { git = "https://github.com/OpenBMB/VoxCPM.git", rev = "616d3d3e630a9c96c2853250eef91b0f39dcd5fa" }
torch = [
    { index = "pytorch-cu128", extra = "gpt-sovits" },
    { index = "pytorch-cu128", extra = "irodori" },
    { index = "pytorch-cu130", extra = "qwen" },
    { index = "pytorch-cu130", extra = "voxcpm2" },
]
torchaudio = [
    { index = "pytorch-cu128", extra = "gpt-sovits" },
    { index = "pytorch-cu128", extra = "irodori" },
    { index = "pytorch-cu130", extra = "qwen" },
    { index = "pytorch-cu130", extra = "voxcpm2" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
