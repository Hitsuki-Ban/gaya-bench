[project]
name = "gaya-pipeline"
version = "0.1.0"
description = "Gaya Bench のシナリオ検証・音声生成パイプライン"
readme = "README.md"
authors = [
    { name = "Hitsuki-Ban", email = "houtei.ban@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.57",
    "jsonschema>=4.26.0",
    "pyopenjtalk-plus==0.4.1.post8",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
chatterbox = [
    "chatterbox-tts",
    "resemble-perth",
    "s3tokenizer==0.3.0",
    "torch==2.6.0; python_version < '3.14'",
    "torch>=2.9.0; python_version >= '3.14'",
    "torchaudio==2.6.0; python_version < '3.14'",
    "torchaudio>=2.9.0; python_version >= '3.14'",
]
cosyvoice3 = [
    "conformer==0.3.2",
    "diffusers==0.29.0",
    "gdown==5.1.0",
    "hydra-core==1.3.2",
    "hyperpyyaml==1.2.3",
    "inflect==7.3.1",
    "librosa==0.10.2",
    "lightning==2.2.4",
    "matplotlib==3.7.5",
    "modelscope==1.20.0",
    "networkx==3.1",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "onnxruntime-gpu==1.18.0",
    "openai-whisper==20231117",
    "protobuf==4.25",
    "pyarrow==18.1.0",
    "pyworld==0.3.4",
    "rich==13.7.1",
    "setuptools==80.9.0",
    "soundfile==0.12.1",
    "torch==2.3.1",
    "torchaudio==2.3.1",
    "transformers==4.51.3",
    "wget==3.2",
    "x-transformers==2.11.24",
]
gpt-sovits = [
    "cn2an==0.5.24",
    "fast-langdetect==1.0.1",
    "ffmpeg-python==0.2.0",
    "jieba==0.42.1",
    "jieba-fast==0.53",
    "librosa==0.10.2",
    "matplotlib==3.10.3",
    "numpy==1.26.4",
    "peft==0.17.1",
    "pypinyin==0.55.0",
    "pytorch-lightning==2.6.5",
    "split-lang==2.1.1",
    "torch==2.7.0",
    "torchaudio==2.7.0",
    "torchmetrics==1.5.2",
    "transformers==4.50.3",
    "x-transformers==2.24.0",
]
irodori = [
    "irodori-tts==0.1.0",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchcodec==0.10.0",
]
qwen = [
    "qwen-tts==0.1.1",
    "torch==2.11.0",
    "torchaudio==2.11.0",
]
voxcpm2 = [
    "funasr==1.3.1",
    "huggingface-hub==1.7.1",
    "modelscope==1.35.0",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchcodec==0.10.0",
    "transformers==5.3.0",
    "voxcpm",
    "wetext==0.1.2",
]

[project.scripts]
gaya = "gaya_pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
override-dependencies = [
    "resemble-perth @ git+https://github.com/resemble-ai/Perth.git@ce86c49d029f42272c1902eccb675556b9ed2330",
]
conflicts = [
    [
        { extra = "gpt-sovits" },
        { extra = "irodori" },
    ],
    [
        { extra = "gpt-sovits" },
        { extra = "qwen" },
    ],
    [
        { extra = "irodori" },
        { extra = "qwen" },
    ],
    [
        { extra = "gpt-sovits" },
        { extra = "voxcpm2" },
    ],
    [
        { extra = "irodori" },
        { extra = "voxcpm2" },
    ],
    [
        { extra = "qwen" },
        { extra = "voxcpm2" },
    ],
    [
        { extra = "chatterbox" },
        { extra = "gpt-sovits" },
    ],
    [
        { extra = "chatterbox" },
        { extra = "irodori" },
    ],
    [
        { extra = "chatterbox" },
        { extra = "qwen" },
    ],
    [
        { extra = "chatterbox" },
        { extra = "voxcpm2" },
    ],
    [
        { extra = "cosyvoice3" },
        { extra = "chatterbox" },
    ],
    [
        { extra = "cosyvoice3" },
        { extra = "gpt-sovits" },
    ],
    [
        { extra = "cosyvoice3" },
        { extra = "irodori" },
    ],
    [
        { extra = "cosyvoice3" },
        { extra = "qwen" },
    ],
    [
        { extra = "cosyvoice3" },
        { extra = "voxcpm2" },
    ],
]
extra-build-variables = { sentencepiece = { CMAKE_POLICY_VERSION_MINIMUM = "3.5" } }

[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools==80.9.0"]

[tool.uv.sources]
chatterbox-tts = { git = "https://github.com/resemble-ai/chatterbox.git", rev = "65b18437192794391a0308a8f705b1e33e633948" }
irodori-tts = { git = "https://github.com/Aratako/Irodori-TTS.git", rev = "eaf74d6a19138f743acb5b71a445fd25a57db987" }
dacvae = { git = "https://github.com/facebookresearch/dacvae", rev = "414c20785fc3a28373073ea8ef7a1316eeeaca6e" }
resemble-perth = { git = "https://github.com/resemble-ai/Perth.git", rev = "ce86c49d029f42272c1902eccb675556b9ed2330" }
voxcpm = { git = "https://github.com/OpenBMB/VoxCPM.git", rev = "616d3d3e630a9c96c2853250eef91b0f39dcd5fa" }
onnxruntime-gpu = { index = "onnxruntime-cuda12" }
torch = [
    { index = "pytorch-cu126", extra = "chatterbox" },
    { index = "pytorch-cu121", extra = "cosyvoice3" },
    { index = "pytorch-cu128", extra = "gpt-sovits" },
    { index = "pytorch-cu128", extra = "irodori" },
    { index = "pytorch-cu130", extra = "qwen" },
    { index = "pytorch-cu130", extra = "voxcpm2" },
]
torchaudio = [
    { index = "pytorch-cu126", extra = "chatterbox" },
    { index = "pytorch-cu121", extra = "cosyvoice3" },
    { index = "pytorch-cu128", extra = "gpt-sovits" },
    { index = "pytorch-cu128", extra = "irodori" },
    { index = "pytorch-cu130", extra = "qwen" },
    { index = "pytorch-cu130", extra = "voxcpm2" },
]

[[tool.uv.index]]
name = "onnxruntime-cuda12"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
